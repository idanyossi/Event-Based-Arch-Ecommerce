version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672" 
      - "15672:15672" 
    networks:
      - ecommerce-net

  producer:
    build: 
      context: ./producer
      dockerfile: Dockerfile
    container_name: producer-service
    ports:
      - "3000:3000"
    depends_on:
      - rabbitmq
    environment:
      - RABBIT_URL=amqp://rabbitmq
    networks:
      - ecommerce-net

networks:
  ecommerce-net:
    name: ecommerce-shared-network