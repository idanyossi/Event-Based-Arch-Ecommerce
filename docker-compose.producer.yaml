version: '3.8'

services:
  # Kafka requires Zookeeper to manage the cluster metadata
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - ecommerce-net

  # The actual Kafka Broker
  kafka:
    image: confluentinc/cp-kafka:7.5.0  # Use a specific version that supports Zookeeper reliably
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Simplest configuration for Docker-to-Docker communication
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    networks:
      - ecommerce-net

  producer:
    image: idanyossi/eventkafka:latest # Using your existing image
    container_name: producer-service
    ports:
      - "3000:3000"
    depends_on:
      - kafka
    environment:
      - KAFKA_BROKERS=kafka:9092 
    networks:
      - ecommerce-net

networks:
  ecommerce-net:
    name: ecommerce-shared-network